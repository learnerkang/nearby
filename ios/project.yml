# Generates Nearby.xcodeproj:
#   brew install xcodegen && cd ios && xcodegen generate
# docs/SETUP.md has the click-through alternative if you would rather not
# install XcodeGen.
name: Nearby
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # iPhone only. Adding iPad means Apple also demands a separate set of
    # iPad screenshots at submission for no real benefit here.
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Nearby:
    type: application
    platform: iOS
    sources:
      - path: Nearby
    info:
      path: Nearby/Info.plist
    settings:
      base:
        # ---------------------------------------------------------------
        # CHANGE THESE TWO before your first build. The bundle id must be
        # globally unique and must match the App ID in your Apple Developer
        # account; DEVELOPMENT_TEAM is your 10-character Team ID.
        # ---------------------------------------------------------------
        PRODUCT_BUNDLE_IDENTIFIER: com.example.nearby
        DEVELOPMENT_TEAM: ""
        INFOPLIST_FILE: Nearby/Info.plist
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
